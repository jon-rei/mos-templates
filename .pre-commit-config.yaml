repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: format-templates
        name: format Docker templates
        entry: scripts/format-templates.py
        language: python
        files: ^docker/.*\.json$
        pass_filenames: false
